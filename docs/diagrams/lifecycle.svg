<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lifecycle-title lifecycle-desc">
      <title id="lifecycle-title">VoxyGlider job lifecycle</title>
      <desc id="lifecycle-desc">State machine for a VoxyGlider job: a spoken task becomes a draft on the phone, is sent and queued at the relay, claimed by the runner and run in the developer's workspace, pauses in Awaiting approval whenever it needs extra authority, and ends either ready for review on its own branch or cancelled; losing the phone connection does not stop a running job. Only the draft state ships in the 0.1.0 preview.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== transitions (drawn before states) ===== -->
      <line x1="68" y1="160" x2="112" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="272" y1="160" x2="320" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="160" x2="528" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="688" y1="160" x2="736" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- running → awaiting approval -->
      <line x1="576" y1="200" x2="576" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- awaiting approval → running -->
      <line x1="640" y1="280" x2="640" y2="200" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- awaiting approval → cancelled -->
      <line x1="528" y1="320" x2="480" y2="320" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- ready for review → end -->
      <line x1="816" y1="200" x2="816" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- running self-loop: the phone drops, the job continues -->
      <path d="M 584,120 C 584,72 632,72 632,120" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- ===== transition labels ===== -->
      <rect x="72" y="140" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="90" y="149" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPEAK</text>
      <rect x="280" y="140" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="296" y="149" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEND</text>
      <rect x="484" y="140" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="504" y="149" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAIM</text>
      <rect x="696" y="140" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="712" y="149" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DONE</text>
      <rect x="496" y="228" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="532" y="237" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEEDS APPROVAL</text>
      <rect x="648" y="228" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="676" y="237" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPROVED</text>
      <rect x="484" y="300" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="504" y="309" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DENIED</text>
      <rect x="824" y="244" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="852" y="253" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YOU MERGE</text>
      <rect x="572" y="56" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="608" y="65" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PHONE OFFLINE</text>

      <!-- ===== states ===== -->
      <circle cx="60" cy="160" r="6" fill="#2d3142"/>

      <rect x="112" y="120" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="112" y="120" width="160" height="80" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="120" y="128" width="44" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="142" y="137" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHIPPED</text>
      <text x="192" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Draft</text>
      <text x="192" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">saved on the phone</text>
      <rect x="320" y="120" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="320" y="120" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="328" y="128" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="352" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLANNED</text>
      <text x="400" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Queued</text>
      <text x="400" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">held by the relay</text>
      <rect x="528" y="120" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="528" y="120" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="536" y="128" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="560" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLANNED</text>
      <text x="608" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Running</text>
      <text x="608" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">in your workspace</text>
      <rect x="736" y="120" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="736" y="120" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="744" y="128" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="768" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLANNED</text>
      <text x="816" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ready for review</text>
      <text x="816" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">its own branch</text>
      <rect x="528" y="280" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="528" y="280" width="160" height="80" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="536" y="288" width="48" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="560" y="297" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLANNED</text>
      <text x="608" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Awaiting approval</text>
      <text x="608" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the phone asks you</text>
      <rect x="320" y="280" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="320" y="280" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="328" y="288" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="352" y="297" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLANNED</text>
      <text x="400" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cancelled</text>
      <text x="400" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">work stops, branch kept</text>

      <circle cx="816" cy="304" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="816" cy="304" r="5" fill="#2d3142"/>

      <!-- ===== annotation ===== -->
      <text x="112" y="304" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Any active state → Cancelled</text>
      <text x="112" y="324" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">on cancel, budget or timeout.</text>

      <!-- ===== legend ===== -->
      <line x1="24" y1="380" x2="936" y2="380" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="24" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <circle cx="110" cy="401" r="6" fill="#2d3142"/>
      <text x="122" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">start</text>

      <circle cx="210" cy="401" r="7" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="210" cy="401" r="4" fill="#2d3142"/>
      <text x="224" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">end</text>

      <rect x="304" y="396" width="12" height="12" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="322" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">in the 0.1.0 preview</text>

      <rect x="484" y="396" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="502" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">planned</text>

      <rect x="604" y="396" width="12" height="12" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="622" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">human in the loop</text>

      <line x1="764" y1="402" x2="784" y2="402" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="792" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">exception path</text>
    </svg>
