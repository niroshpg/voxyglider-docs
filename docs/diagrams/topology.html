<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoxyGlider — system topology</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · VoxyGlider</p>
    <h1>The phone directs. The workspace keeps the keys.</h1>

    <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="topology-title topology-desc">
      <title id="topology-title">VoxyGlider system topology</title>
      <desc id="topology-desc">A developer speaks a task to the VoxyGlider phone app, which sends it to a relay; a runner inside the developer's own workspace holds an outbound-only session to that relay and starts a coding agent that edits an isolated branch of the repository. Privileged actions such as deploy, merge or secret access pass only through an approval gate answered from the phone; inbound connections to the workspace and unapproved privileged actions are both blocked.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== zones (painted before arrows and nodes) ===== -->
      <rect x="24" y="88" width="200" height="384" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="88" y="92" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="124" y="101" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">YOUR PHONE</text>

      <rect x="264" y="88" width="200" height="384" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="312" y="92" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="364" y="101" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BYTE VISIONS RELAY</text>

      <rect x="504" y="88" width="432" height="384" rx="8" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="624" y="92" width="192" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="101" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">YOUR WORKSPACE · TRUST BOUNDARY</text>

      <!-- ===== arrows (drawn before nodes) ===== -->
      <!-- developer → app -->
      <line x1="124" y1="200" x2="124" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- app → relay: the task -->
      <line x1="204" y1="292" x2="284" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- relay → app: updates and questions (async) -->
      <line x1="284" y1="324" x2="204" y2="324" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- runner → relay: outbound-only session -->
      <line x1="524" y1="308" x2="444" y2="308" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- runner → agent -->
      <line x1="684" y1="308" x2="756" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- agent → repository -->
      <line x1="836" y1="352" x2="836" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- agent → approval gate -->
      <path d="M 780,264 V 240 Q 780,232 772,232 H 612 Q 604,232 604,224 V 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- gate → privileged actions: the only approved route -->
      <line x1="684" y1="164" x2="756" y2="164" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- blocked: agent → privileged actions without approval -->
      <line x1="876" y1="264" x2="876" y2="216" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="4,3"/>
      <line x1="868" y1="212" x2="884" y2="212" stroke="#2d3142" stroke-width="1.6"/>
      <!-- blocked: inbound connection to the workspace -->
      <line x1="880" y1="40" x2="880" y2="76" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="4,3"/>
      <line x1="872" y1="80" x2="888" y2="80" stroke="#2d3142" stroke-width="1.6"/>

      <!-- ===== arrow labels ===== -->
      <rect x="132" y="226" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="168" y="235" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPEAKS A TASK</text>

      <rect x="220" y="272" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="244" y="281" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TASK</text>

      <rect x="216" y="332" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="244" y="341" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPDATES</text>

      <rect x="448" y="288" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="484" y="297" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OUTBOUND TLS</text>

      <rect x="696" y="288" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="297" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STARTS</text>

      <rect x="844" y="362" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="864" y="371" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EDITS</text>

      <rect x="664" y="212" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="692" y="221" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUESTS</text>

      <rect x="692" y="144" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="153" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPROVED</text>

      <rect x="804" y="236" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="836" y="245" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO APPROVAL</text>

      <rect x="764" y="44" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="816" y="53" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO INBOUND PORT</text>

      <!-- ===== nodes ===== -->
      <!-- Developer (input) -->
      <rect x="44" y="128" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="44" y="128" width="160" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="52" y="134" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="68" y="143" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="124" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Developer</text>
      <text x="124" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">away from the desk</text>

      <!-- VoxyGlider app -->
      <rect x="44" y="264" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="44" y="264" width="160" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="52" y="270" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="66" y="279" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="124" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">VoxyGlider app</text>
      <text x="124" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">iOS · Android</text>
      <text x="124" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">voice · status · approve</text>

      <!-- Relay (external / cloud) -->
      <rect x="284" y="264" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="284" y="264" width="160" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="292" y="270" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="312" y="279" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLOUD</text>
      <text x="364" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Relay</text>
      <text x="364" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">accounts · job state</text>
      <text x="364" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no repository copy</text>

      <!-- Approval gate (privileged gate) -->
      <rect x="524" y="128" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="524" y="128" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="532" y="134" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="548" y="143" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
      <text x="604" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Approval gate</text>
      <text x="604" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">answered on the phone</text>

      <!-- Privileged actions -->
      <rect x="756" y="128" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="756" y="128" width="160" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="764" y="134" width="64" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="796" y="143" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PRIVILEGED</text>
      <text x="836" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Privileged actions</text>
      <text x="836" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deploy · merge · secrets</text>

      <!-- Runner (focal) -->
      <rect x="524" y="264" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="524" y="264" width="160" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="532" y="270" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="554" y="279" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUNNER</text>
      <text x="604" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">VoxyGlider Runner</text>
      <text x="604" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">installed and paired once</text>
      <text x="604" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scoped to this workspace</text>

      <!-- Coding agent -->
      <rect x="756" y="264" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="756" y="264" width="160" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="764" y="270" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="782" y="279" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="836" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Coding agent</text>
      <text x="836" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Codex runtime</text>
      <text x="836" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">your own sign-in</text>

      <!-- Repository (store) -->
      <rect x="756" y="384" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="756" y="384" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="764" y="390" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="780" y="399" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPO</text>
      <text x="836" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Repository</text>
      <text x="836" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">isolated branch / worktree</text>

      <!-- ===== legend ===== -->
      <line x1="24" y1="496" x2="936" y2="496" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="24" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="104" y="508" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="122" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">runner (focal)</text>

      <rect x="244" y="508" width="12" height="12" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="262" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">trust boundary</text>

      <line x1="384" y1="514" x2="404" y2="514" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="412" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">approved route</text>

      <line x1="524" y1="514" x2="540" y2="514" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="4,3"/>
      <line x1="544" y1="508" x2="544" y2="520" stroke="#2d3142" stroke-width="1.6"/>
      <text x="552" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">blocked route</text>

      <line x1="664" y1="514" x2="684" y2="514" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="692" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">outbound session</text>

      <line x1="804" y1="514" x2="824" y2="514" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="832" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">async update</text>
    </svg>
  </div>
</body>
</html>
